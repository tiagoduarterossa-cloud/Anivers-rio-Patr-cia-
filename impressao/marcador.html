<!doctype html><html lang="pt"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=block">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}html,body{margin:0}
body{width:210mm;height:297mm;background:#fff;font-family:"DM Sans",sans-serif;color:#1d2a2a;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative}
body.solo{width:50mm;height:170mm}
.wrap{position:absolute;left:80mm;top:63.5mm}
.solo .wrap{left:0;top:0}
.bm{width:50mm;height:170mm;background:#fdf6e8;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{background:#e2574c;color:#fdf6e8;padding:7mm 5mm 4mm;text-align:center}
.top .eb{font-size:6pt;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.9}
.top .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15pt;line-height:1;margin-top:1.5mm}
.hole{position:absolute;top:3mm;left:50%;width:3.2mm;height:3.2mm;margin-left:-1.6mm;border-radius:50%;background:#fdf6e8}
.perf{height:3mm;background:radial-gradient(circle at 1.5mm -.2mm,#e2574c 1.5mm,transparent 1.65mm) 0 0/3mm 3mm repeat-x}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 5.5mm;text-align:center;gap:5mm}
.stars{color:#d9a521;font-size:9pt;letter-spacing:.4em}
.q{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:12.5pt;line-height:1.3;margin:0}
.q b{font-weight:800;color:#e2574c}
.sig{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:12pt;color:#e2574c}
.foot{border-top:.3mm dashed #d9c9a8;margin:0 5mm;padding:2.5mm 0 5mm;display:flex;justify-content:space-between;font-size:6pt;letter-spacing:.08em;color:#5f6f6c}
.gold{height:2.5mm;background:linear-gradient(90deg,#b8860b,#f3d36b 35%,#d9a521 55%,#f7e08a)}
/* marcas de corte */
.cm{position:absolute;background:#999}
.h{height:.2mm;width:6mm}.v{width:.2mm;height:6mm}
.solo .cm,.solo .tip{display:none}
.tip{position:absolute;left:0;right:0;top:250mm;text-align:center;font-size:8pt;color:#999}
</style></head><body>
<div class="wrap">
  <div class="bm">
    <div class="top"><div class="eb">Bilhete Nº 0001</div><div class="n">Pequenas coisas</div></div>
    <div class="perf"></div>
    <div class="mid">
      <div class="stars">★ ★ ★</div>
      <p class="q">Patrícia, desde a creche que fazes parte das minhas <b>pequenas coisas</b>.</p>
      <p class="q">Parabéns pelos&nbsp;50.</p>
      <div class="sig">Tiago</div>
      <div class="stars">★ ★ ★</div>
    </div>
    <div class="foot"><span>13 · 11 · 2026</span><span>Série 2026</span></div>
    <div class="gold"></div>
  </div>
</div>
<!-- cantos: bookmark de 80..130mm x 63.5..233.5mm -->
<div class="cm h" style="left:72mm;top:63.5mm"></div><div class="cm h" style="left:132mm;top:63.5mm"></div>
<div class="cm h" style="left:72mm;top:233.5mm"></div><div class="cm h" style="left:132mm;top:233.5mm"></div>
<div class="cm v" style="left:80mm;top:55.5mm"></div><div class="cm v" style="left:130mm;top:55.5mm"></div>
<div class="cm v" style="left:80mm;top:235.5mm"></div><div class="cm v" style="left:130mm;top:235.5mm"></div>
<div class="tip">Imprimir em A4 a 100% · cortar pelas marcas · 5 × 17 cm</div>
</body></html>
